appId: global.dahl.studio
productName: Dahl Studio
copyright: Copyright (c) 2026 NexKeys. All rights reserved.
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
  - LICENSE
extraResources:
  - from: resources/icon.png
    to: icon.png
  # built-in Agent Skills (SKILL.md folders), read at runtime from <resources>/skills (src/main/services.ts builtinSkillsDir)
  - from: skills
    to: skills
    filter:
      - "**/*"
asarUnpack:
  - resources/**
  - node_modules/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: DahlStudio
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dahl Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: DahlStudio-Setup-${version}.exe
npmRebuild: false
publish:
  provider: github
  owner: Nexkeys
  repo: dahl-studio
  releaseType: release
